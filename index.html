<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming Zone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      max-width: 700px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { line-height: 1.6; color: #cbd5e1; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.2rem;
      background: #38bdf8;
      color: #082f49;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 Gaming Zone</h1>
    <p>This project contains a collection of classic terminal games such as Tic-Tac-Toe, Rock-Paper-Scissors, Hangman, Sudoku, Snake, and Number Guessing.</p>
    <p>Run the C++ version locally, or open the browser-based terminal view to interact with it.</p>
    <a href="http://127.0.0.1:7681/" target="_blank" rel="noopener">Open the browser terminal</a>
  </div>
</body>
</html>
